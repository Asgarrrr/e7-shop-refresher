[package]
name = "e7-shop-refresher"
version = "0.6.1"
edition = "2024"
authors = ["Asgarrrr"]
description = "Epic Seven shop refresh automation tool for the STOVE PC client"
license = "MIT"

[dependencies]
xcap = { version = "0.9", features = ["wgc"] }
image = "0.25"
imageproc = { version = "0.26", default-features = false, features = ["rayon"] }
rayon = "1"
enigo = "0.6"

anyhow = "1"
thiserror = "2"

serde = { version = "1", features = ["derive"] }
toml = "1.1"
toml_edit = "0.25"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

clap = { version = "4.6", features = ["derive"] }
rand = "0.10"
rand_distr = "0.6"
rustc-hash = "2"
ctrlc = "3.5"

eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.33"
egui-phosphor = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
