[package]
name = "arkyve-refresh-shop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Relais local passif qui capture le trafic du Secret Shop d'Epic Seven et le transmet au serveur d'analyse."
license = "MIT"
publish = false

[features]
default = ["windivert-backend"]
# Backend de capture natif Windows (WinDivert). Désactiver pour compiler/tester
# le pipeline (réassemblage, uplink, modèles) sans le SDK WinDivert.
windivert-backend = ["dep:windivert"]

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "io-std",
    "io-util",
    "signal",
] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
etherparse = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"

[target.'cfg(windows)'.dependencies]
windivert = { version = "0.7.0-beta.4", optional = true }

[profile.release]
lto = "thin"
strip = true
