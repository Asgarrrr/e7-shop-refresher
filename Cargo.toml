[package]
name = "arkyve-refresh-shop"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Local relay that captures Epic Seven Secret Shop traffic, forwards it to the analysis server, and drives the refresh loop by clicking the game window."
license = "MIT"
publish = false

[features]
default = ["windivert-backend", "gui", "actuator"]
# Native Windows capture backend (WinDivert), the shipped default. Delivers
# IP-layer copies of the game's TCP packets, so it is indifferent to the link
# layer underneath — the reason it works on WiFi where a NIC-level tap hands
# out 802.11 frames. Links *dynamically* against the vendored prebuilt
# `WinDivert.lib`/`WinDivert.dll` (`WINDIVERT_PATH` in `.cargo/config.toml`);
# never `WINDIVERT_STATIC`, see that file for why. Pulls windows-sys for
# `LoadLibraryW` (the delay-loaded WinDivert.dll is preloaded by full path from
# its extracted app-data location) and for the runtime-dir DACL hardening.
windivert-backend = ["dep:windivert", "dep:windows-sys"]
# Experimental Npcap capture backend, deliberately NOT in `default`. Taps every
# adapter through `wpcap.dll` from an ordinary, *unelevated* process — no driver
# load, no broker, no UAC prompt — which is the whole question it exists to
# answer. Pulls `libloading` because the DLL is resolved at runtime rather than
# linked (a static link would need the Npcap SDK to build and would kill the exe
# in the Windows loader on a machine without Npcap), and windows-sys for the one
# registry read that tells "Npcap is admins-only" apart from "no adapters".
# Wins over `windivert-backend` in `app::build_source` when both are compiled.
pcap-backend = ["dep:libloading", "dep:windows-sys"]
# egui window over the session (dashboard + player commands). Disable for the
# console-only build.
gui = ["dep:eframe"]
# Click-emulation input backends (SendInput / PostMessageW). Only act on
# Windows; elsewhere the executor is replaced by a job-draining stub.
actuator = ["dep:windows-sys"]

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "io-std",
    "io-util",
    "signal",
] }
# rustls + webpki-roots: the hosted server is wss:// behind Cloudflare, and a
# single-file exe should not depend on the OS trust store. connect_async picks
# up the rustls connector automatically once the feature is on.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
# Direct rustls dep only to pull the `ring` provider and install it in main();
# tokio-tungstenite enables rustls with no provider, which panics at handshake.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
etherparse = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = { version = "0.25", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# The windowed build has no console: stdout is an inert sink, so every log
# would be lost. Logs go to a daily-rotated file under %LOCALAPPDATA%.
tracing-appender = "0.2"
# glow renderer only: targets are Windows (player) and macOS (dev); the
# default wgpu/x11/wayland stacks would only slow the build down.
eframe = { version = "0.35", optional = true, default-features = false, features = [
    "glow",
    "default_fonts",
] }

[target.'cfg(windows)'.dependencies]
# Default features only: `static`/`vendored` are deliberately OFF. See
# `.cargo/config.toml` — `WINDIVERT_STATIC` compiles the vendor C in-tree and
# the resulting object breaks the release build's stack-guard probing.
windivert = { version = "0.7.0-beta.4", optional = true }
# Runtime resolution of `wpcap.dll` for the Npcap backend. Never a link-time
# dependency: see the `pcap-backend` feature comment above.
libloading = { version = "0.8", optional = true }
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    # `ProcessPrng`, for the 128-bit pipe nonce: the modern handle-free CSPRNG
    # primitive (the one `getrandom` uses on Windows), so no `rand` dependency.
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    # `CoInitializeEx`: `ShellExecuteExW` requires an initialized apartment on
    # the calling thread, and nothing else in the app initializes COM.
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    # The elevated capture broker: the named pipe it serves (`Pipes`), the
    # overlapped connect and write that keep every wait on it bounded (`IO`),
    # and the UI-process handle, token and watchdog wait (`Threading`).
    "Win32_System_Pipes",
    # Not for the registry: `SHELLEXECUTEINFOW` carries an `HKEY` field, and
    # windows-sys gates the whole struct behind this group.
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    # `ShellExecuteExW` with the `runas` verb — the only way to launch the
    # broker elevated (`CreateProcessW` cannot, see `capture::elevate`).
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Headless widget-interaction tests for the ui module (no renderer needed).
# Dev-deps cannot be feature-gated: the console-only test lane builds egui
# once too; the kittest tests themselves are behind the `gui` feature.
egui_kittest = { version = "0.35", default-features = false, features = ["wgpu", "snapshot"] }
# Paused-clock tests (`start_paused`) for the uplink send timeout.
tokio = { version = "1", features = ["test-util"] }

# Dashboard preview with injected mock data — lets the egui UI be seen on a
# machine with no capture backend (mac dev). Reuses the real `ShopApp`; needs
# eframe, hence the `gui` feature.
[[example]]
name = "ui_preview"
required-features = ["gui"]

# Dependencies are compiled once and reused by every dev and test build; at
# opt-level 0 an egui/glow UI is visibly sluggish (see `examples/ui_preview`)
# and the kittest lane crawls. Our own crate stays unoptimized and debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
# Not `strip = true`: that drops the symbol table too, and `crash.rs`'s
# `Backtrace::force_capture()` — the product's only post-mortem channel —
# then records bare addresses. Debug info goes, symbol names stay.
strip = "debuginfo"
codegen-units = 1
