[package]
name = "arkyve-refresh-shop"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Local relay that captures Epic Seven Secret Shop traffic, forwards it to the analysis server, and drives the refresh loop by clicking the game window."
license = "MIT"
publish = false

[features]
default = ["pcap-backend", "gui", "actuator"]
# Npcap capture backend — the only one, and the shipped default. Taps every
# adapter through `wpcap.dll` and needs no privilege of its own: it was proven
# end to end from an ordinary *unelevated* process (capture → reassembly →
# uplink → decoded snapshot → refresh job). The exe is still manifested
# `requireAdministrator`, but for the actuator and not for this — see
# `build.rs`. Pulls `libloading` because the DLL is resolved at runtime rather
# than linked (a static link would need the Npcap SDK to build and would kill
# the exe in the Windows loader on a machine without Npcap). Off in the two
# portable lanes, where `app::build_source` returns "no capture backend" instead.
pcap-backend = ["dep:libloading"]
# egui window over the session (dashboard + player commands). Disable for the
# console-only build.
gui = ["dep:eframe"]
# Click-emulation input backends (SendInput / PostMessageW). Only act on
# Windows; elsewhere the executor is replaced by a job-draining stub.
actuator = []

# The lint policy, in the one place `rust-analyzer`, a plain `cargo build` and a
# reader of this manifest all see it. Until now it existed only as the four
# `cargo clippy … -- -D warnings` invocations in `.github/workflows/ci.yml` and
# the `justfile`, which no editor can read. Every entry below measures **zero
# sites** on all four feature lanes and on both matrix toolchains, so nothing
# here is a migration.
#
# A `[lints]` table applies to *every* target, the test harness included. That is
# why `clippy::unwrap_used` (257 sites, all of them in tests, where `unwrap` in a
# fixture is the correct spelling) and `clippy::panic` (19, likewise) are **not**
# here — they belong in a `#![cfg_attr(not(test), warn(…))]` at the crate root.
# The five below measure zero in the test harness as well, so the table is the
# right home for them.
#
# Deliberately *not* enabled, each measured and argued in `docs/tech-debt/25-lint.md`:
# whole-group `pedantic` (161 sites) and `nursery` (121) — nearly all of them are
# this crate doing something deliberate with the reason written at the site;
# `clippy::cargo` (29 unactionable `multiple_crate_versions` out of the eframe
# tree, already covered better by `cargo deny`'s `[bans]`); `missing_docs` (141,
# on a `publish = false` binary); `expect_used` (13 shipped sites where the
# message *is* the invariant); `indexing_slicing` (3, all provably in bounds).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [] } # 0 — every cfg string matches a declared feature
trivial_casts = "warn"                               # 0
# `size_of`/`align_of` and friends joined the prelude in 1.80, so `std::mem::` in
# front of them is noise that reads as a different function. Measured across
# `--all-targets --all-features`, test harness included, which is where 21 of the
# original 22 sites were.
unused_qualifications = "warn" # 0
# A `pub` item that no path outside the crate can reach is a claim the module
# graph contradicts. Enabled *instead of* `clippy::redundant_pub_crate`, not
# beside it: for the 15 `pub(crate)` items inside the private `mod render` and
# `mod pcap`, `redundant_pub_crate`'s only suggestion is `pub` — and taking it
# makes all 15 fire here instead (verified by applying it). The two lints have no
# common fixed point for a private module, and of the pair this is the one that
# catches a real error rather than a spelling.
unreachable_pub = "warn" # 0

[lints.clippy]
# Whole groups. `priority = -1` so an individually named lint can override one.
correctness = { level = "deny", priority = -1 } # 0
suspicious = { level = "deny", priority = -1 }  # 0
style = { level = "warn", priority = -1 }       # 0
complexity = { level = "warn", priority = -1 }  # 0
perf = { level = "warn", priority = -1 }        # 0
# This is an FFI-heavy crate — `windows-sys` plus a runtime-loaded `wpcap.dll` —
# and every `unsafe` block in it already carries a real `// SAFETY:`. New unsafe
# arrives with every Win32 call added, so turn the convention into a check.
undocumented_unsafe_blocks = "warn" # 0
# The other half of that convention: a `// SAFETY:` above a block holding several
# Win32 calls answers for whichever one the reader guesses. One call per block
# makes the comment and the operation line up.
multiple_unsafe_ops_per_block = "warn" # 0
# Two nursery lints, named individually — the whole group is 121 sites and argued
# down in `docs/tech-debt/25-lint.md`. Both are at 0 and both caught something
# real on the way there. Nursery means a future clippy may widen them; if one
# starts producing false positives, demote that line rather than the group.
redundant_clone = "warn"     # 0
format_push_string = "warn"  # 0
# Zero in the test harness too, unlike `unwrap_used`/`panic` above.
todo = "warn"           # 0
unimplemented = "warn"  # 0
dbg_macro = "warn"      # 0
mem_forget = "warn"     # 0
exit = "warn"           # 0

# rustdoc was the one lane nothing gated, and it was not clean. `just doc` and
# the CI step both run `--document-private-items`, which is the right mode for a
# `publish = false` binary: the cross-reference network these docs navigate by is
# mostly between internal items, so that is the only way it gets checked at all.
#
# The levels are here rather than in a `RUSTDOCFLAGS="-D warnings"` on the
# command line so that `just doc`, the CI step and an editor cannot disagree, and
# so that a rustdoc lint added by a future stable release only *warns* instead of
# turning the `stable` matrix arm red. Every one below is warn-by-default and
# measures zero sites today.
[lints.rustdoc]
broken_intra_doc_links = "deny"
redundant_explicit_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
# Measured, and contrary to what the lint's name suggests: rustdoc reports a
# public doc linking to a private item *even under* `--document-private-items`,
# where the target is rendered and the link works. The lint exists for published
# crates, whose private items are absent from the output. Five such links are
# deliberate here.
private_intra_doc_links = "allow"

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "io-std",
    "io-util",
    "signal",
] }
# rustls + webpki-roots: the hosted server is wss:// behind Cloudflare, and a
# single-file exe should not depend on the OS trust store. connect_async picks
# up the rustls connector automatically once the feature is on.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
# Direct rustls dep only to pull the `ring` provider and install it in main();
# tokio-tungstenite enables rustls with no provider, which panics at handshake.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
etherparse = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = { version = "0.25", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# The windowed build has no console: stdout is an inert sink, so every log
# would be lost. Logs go to a daily-rotated file under %LOCALAPPDATA%.
tracing-appender = "0.2"
# glow renderer only: targets are Windows (player) and macOS (dev); the
# default wgpu/x11/wayland stacks would only slow the build down.
eframe = { version = "0.35", optional = true, default-features = false, features = [
    "glow",
    "default_fonts",
] }

[target.'cfg(windows)'.dependencies]
# Runtime resolution of `wpcap.dll` for the Npcap backend. Never a link-time
# dependency: see the `pcap-backend` feature comment above.
libloading = { version = "0.8", optional = true }
# Not optional, unlike the two above: `migrate` needs it in *every* Windows
# build to undo the admins-only DACL a WinDivert build left on the app-data
# directory, including the `--no-default-features` one. Three features used to
# each turn it on with `dep:windows-sys`, which is how a lane could end up
# without it.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # Reading and rewriting the app-data directory's DACL (`migrate`).
    "Win32_Security",
    "Win32_Security_Authorization",
    # `GetModuleHandleW`, for the window class the actuator drives.
    "Win32_System_LibraryLoader",
    # `HKLM\...\npcap\Parameters\AdminOnly`: the one read that tells "Npcap is
    # restricted to administrators" apart from "this machine has no adapters".
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Headless widget-interaction tests for the ui module (no renderer needed).
# Dev-deps cannot be feature-gated: the console-only test lane builds egui
# once too; the kittest tests themselves are behind the `gui` feature.
egui_kittest = { version = "0.35", default-features = false, features = ["wgpu", "snapshot"] }
# Paused-clock tests (`start_paused`) for the uplink send timeout.
tokio = { version = "1", features = ["test-util"] }

# Dashboard preview with injected mock data — lets the egui UI be seen on a
# machine with no capture backend (mac dev). Reuses the real `ShopApp`; needs
# eframe, hence the `gui` feature.
[[example]]
name = "ui_preview"
required-features = ["gui"]

# Dependencies are compiled once and reused by every dev and test build; at
# opt-level 0 an egui/glow UI is visibly sluggish (see `examples/ui_preview`)
# and the kittest lane crawls. Our own crate stays unoptimized and debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
# Thin, not fat, and the reason is recorded rather than assumed: nothing in this
# crate has ever been profiled or benchmarked (no `benches/`, no criterion, and
# the one end-to-end capture test is `#[ignore]`d because it needs a real
# adapter), so "fat is faster here" would be exactly the unmeasured claim the
# rest of this manifest avoids. Thin already gives cross-crate inlining across
# the lib → bin/example boundary, which is the only inlining that matters in a
# single-crate binary with `codegen-units = 1`. Revisit with a measurement — see
# `[profile.profiling]` below for the build that can produce one — not with a
# preference.
lto = "thin"
# Not `strip = true`: that drops the symbol table too, and `crash.rs`'s
# `Backtrace::force_capture()` — the product's only post-mortem channel —
# then records bare addresses. Debug info goes, symbol names stay.
strip = "debuginfo"
codegen-units = 1
# Integer overflow was the one class of fault that bypassed every diagnostic this
# product has: `crash.rs`'s panic hook, the per-worker `catch_unwind` in
# `SessionWorkers::spawn`, the fatal channel into the session loop and the
# symbolised backtrace above all trigger on a panic, and a wrap is not one. The
# arithmetic here runs on values the crate does not control — TCP payload
# lengths, sequence deltas, wire prices and gold balances, `GetSystemMetrics`
# results, config millisecond counts — so a wrap is a wrong click or a stalled
# pipeline that a player reports as "it stopped working" over a log file showing
# nothing at all. Now it is a `crash.log` entry instead.
#
# The prerequisite, audited before enabling this: a panic raised from a `Drop`
# *during an unwind* aborts the process with no banner and no `crash.log` (see
# `stream.rs`'s `PipelineBudget::release`). All four production `Drop` impls were
# read — `PayloadLease` (saturating arithmetic only), `capture::pcap::Handle`
# (one FFI close), `capture::pcap::PcapSource` (an atomic store and joins),
# `actuator::win::MessageSurface` (`cleanup` → `shield::hide`, one FFI call) —
# and none of them performs checkable arithmetic. The cost is a few percent on
# integer-heavy loops, and this pipeline is I/O-bound end to end. Note the dev
# and test profiles have had overflow checks on all along, dependencies
# included, so the whole suite already runs under them.
overflow-checks = true

# Symbols and line numbers for a profiler, without disturbing what ships:
# `release` must keep `strip = "debuginfo"` because `crash.rs` depends on it, so
# a profiling build has to be a separate, purely additive profile. Nothing that
# ships uses this one.
[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
