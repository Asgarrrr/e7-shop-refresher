[package]
name = "arkyve-refresh-shop"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Local relay that captures Epic Seven Secret Shop traffic, forwards it to the analysis server, and drives the refresh loop by clicking the game window."
license = "MIT"
publish = false

[features]
default = ["pcap-backend", "gui", "actuator"]
# Npcap tap through `wpcap.dll`, needing no privilege of its own: the exe's
# `requireAdministrator` is for the actuator (see `build.rs`). `libloading`
# because the DLL is resolved at runtime — a static link would need the Npcap SDK
# and would kill the exe in the Windows loader on a machine without Npcap.
pcap-backend = ["dep:libloading"]
# egui window over the session. Disable for the console-only build.
gui = ["dep:eframe"]
# Click emulation (SendInput / PostMessageW); elsewhere a job-draining stub.
actuator = []

# `# 0` means zero sites measured on all six CI feature lanes, re-measured each
# time an entry is added. A `[lints]` table applies to *every* target, tests
# included, which is why `clippy::unwrap_used` (257 sites, all fixtures) and
# `clippy::panic` (19) live in a `#![cfg_attr(not(test), warn(…))]` at the crate
# root instead.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [] } # 0 — every cfg string matches a declared feature
trivial_casts = "warn"                               # 0
# `size_of`/`align_of` joined the prelude in 1.80; `std::mem::` in front of them
# reads as a different function.
unused_qualifications = "warn" # 0
# Enabled *instead of* `clippy::redundant_pub_crate`, not beside it: for the
# `pub(crate)` items in the private `mod render` and `mod pcap` that lint's only
# suggestion is `pub`, which makes every one of them fire here instead (verified
# by applying it). No common fixed point, and this is the one that catches an
# error rather than a spelling.
unreachable_pub = "warn" # 0

[lints.clippy]
# Whole groups. `priority = -1` so an individually named lint can override one.
correctness = { level = "deny", priority = -1 } # 0
suspicious = { level = "deny", priority = -1 }  # 0
style = { level = "warn", priority = -1 }       # 0
complexity = { level = "warn", priority = -1 }  # 0
perf = { level = "warn", priority = -1 }        # 0
# New unsafe arrives with every Win32 call added. Deleting a `// SAFETY:` comment
# fails the build under CI's `-D warnings`.
undocumented_unsafe_blocks = "warn" # 0
# One `// SAFETY:` over several Win32 calls answers for whichever the reader guesses.
multiple_unsafe_ops_per_block = "warn" # 0
# Nursery, named individually: a future clippy may widen them, so demote the
# line rather than the group.
redundant_clone = "warn"     # 0
format_push_string = "warn"  # 0
# These docs navigate by identifier; an unbackticked one reads as prose while
# linking to nothing.
doc_markdown = "warn"        # 0
# Zero in the test harness too, unlike `unwrap_used`/`panic` above.
todo = "warn"           # 0
unimplemented = "warn"  # 0
dbg_macro = "warn"      # 0
mem_forget = "warn"     # 0
exit = "warn"           # 0
# Ungated: this pipeline saturates and logs rather than aborting a session.
unreachable = "warn"    # 0
# **The two lint names are the opposite way round from how they read.**
# `clippy::mod_module_files` *bans* `mod.rs` and would redden all six lanes,
# reversing the convention it looks like it protects. This one pins it.
self_named_module_files = "warn" # 0

# Here rather than a command-line `RUSTDOCFLAGS="-D warnings"`, so `just doc`, CI
# and an editor cannot disagree and a lint added by a future stable release only
# *warns* instead of reddening a matrix arm.
[lints.rustdoc]
broken_intra_doc_links = "deny"
redundant_explicit_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
# Contrary to the name, rustdoc reports a public doc linking to a private item
# *even under* `--document-private-items`, where the link works. Five are
# deliberate here.
private_intra_doc_links = "allow"

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "io-std",
    "io-util",
    "signal",
] }
# rustls + webpki-roots: the server is wss:// behind Cloudflare, and a
# single-file exe should not depend on the OS trust store.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
# Direct dep only to pull the `ring` provider and install it in main();
# tokio-tungstenite enables rustls with no provider, which panics at handshake.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
etherparse = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = { version = "0.25", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# The windowed build's stdout is an inert sink, so every log would be lost.
tracing-appender = "0.2"
# glow only: targets are Windows and macOS, so wgpu/x11/wayland is build time
# spent on nothing.
eframe = { version = "0.35", optional = true, default-features = false, features = [
    "glow",
    "default_fonts",
] }

[target.'cfg(windows)'.dependencies]
# Runtime resolution of `wpcap.dll`, never a link-time dependency: see
# `pcap-backend` above.
libloading = { version = "0.8", optional = true }
# Not optional, unlike the two above: `migrate` needs it in *every* Windows
# build, `--no-default-features` included, to undo the admins-only DACL.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # Reading and rewriting the app-data directory's DACL (`migrate`).
    "Win32_Security",
    "Win32_Security_Authorization",
    # `BCryptHash`, for the SHA-256 that verifies the Npcap installer before an
    # elevated process runs it (`install`).
    "Win32_Security_Cryptography",
    # `GetModuleHandleW`, for the window class the actuator drives.
    "Win32_System_LibraryLoader",
    # `GetSystemDirectoryW` (`system32::directory`), asked of the OS rather than
    # read from `%SystemRoot%`, which an elevated process inherits from whoever
    # asked for the elevation — and both callers execute or load the answer.
    "Win32_System_SystemInformation",
    # `HKLM\...\npcap\Parameters\AdminOnly`: the one read that tells "Npcap is
    # restricted to administrators" apart from "this machine has no adapters".
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Dev-deps cannot be feature-gated, so the console-only test lane builds egui
# too; the tests themselves are behind `gui`. No `snapshot` — nothing calls
# `assert_snapshot`, and it pulls three crates into all nine `--locked` lanes.
# `wgpu` stays: `editor`'s `timing_meter_grip_moves_with_the_range` needs it.
egui_kittest = { version = "0.35", default-features = false, features = ["wgpu"] }
# Paused-clock tests (`start_paused`) for the uplink send timeout.
tokio = { version = "1", features = ["test-util"] }

# `test = false` because `build.rs` stamps `/MANIFESTUAC:requireAdministrator`
# onto every *bin*; cargo builds `src/main.rs` a second time as a test harness
# that inherits it; Windows refuses to start that harness unelevated, so
# `cargo test` dies with os error 740 after every lib test has passed. The
# harness was always empty — `src/main.rs` has no `#[test]`.
[[bin]]
name = "arkyve-refresh-shop"
path = "src/main.rs"
test = false

# Dashboard preview with injected mock data, so the UI can be seen on a machine
# with no capture backend. Reuses the real `ShopApp`, hence `gui`.
[[example]]
name = "ui_preview"
required-features = ["gui"]

# Dependencies are compiled once and reused by every dev and test build; at
# opt-level 0 an egui/glow UI is visibly sluggish and the kittest lane crawls.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
# Thin, not fat: nothing here has been profiled, so "fat is faster" would be an
# unmeasured claim, and thin already gives the lib → bin inlining that is the
# only kind that matters in a single-crate binary. Revisit with a measurement
# from `[profile.profiling]`.
lto = "thin"
# Not `strip = true`: that drops the symbol table too, and `crash.rs`'s
# `Backtrace::force_capture()` — the only post-mortem channel — then records bare
# addresses.
strip = "debuginfo"
codegen-units = 1
# The one fault class that bypassed every diagnostic here — panic hook,
# `catch_unwind`, fatal channel all trigger on a panic, and a wrap is not one —
# on arithmetic over values the crate does not control. Prerequisite, audited
# before enabling: a panic from a `Drop` *during an unwind* aborts with no
# `crash.log`, so all four production `Drop` impls were read and none performs
# checkable arithmetic.
overflow-checks = true

# Separate additive profile because `release` must keep `strip = "debuginfo"`
# for `crash.rs`.
[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
