[package]
name = "arkyve-refresh-shop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Passive local relay that captures Epic Seven Secret Shop traffic and forwards it to the analysis server."
license = "MIT"
publish = false

[features]
default = ["windivert-backend", "gui"]
# Native Windows capture backend (WinDivert). Disable to build/test the pipeline
# (reassembly, uplink, models) without the WinDivert SDK.
windivert-backend = ["dep:windivert"]
# egui window over the session (dashboard + player commands). Disable for the
# console-only build.
gui = ["dep:eframe"]

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "io-std",
    "io-util",
    "signal",
] }
# rustls + webpki-roots: the hosted server is wss:// behind Cloudflare, and a
# single-file exe should not depend on the OS trust store. connect_async picks
# up the rustls connector automatically once the feature is on.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
etherparse = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# glow renderer only: targets are Windows (player) and macOS (dev); the
# default wgpu/x11/wayland stacks would only slow the build down.
eframe = { version = "0.35", optional = true, default-features = false, features = [
    "glow",
    "default_fonts",
] }

[target.'cfg(windows)'.dependencies]
windivert = { version = "0.7.0-beta.4", optional = true }

[dev-dependencies]
# Headless widget-interaction tests for the ui module (no renderer needed).
# Dev-deps cannot be feature-gated: the console-only test lane builds egui
# once too; the kittest tests themselves are behind the `gui` feature.
egui_kittest = { version = "0.35", default-features = false }
# Paused-clock tests (`start_paused`) for the uplink send timeout.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
strip = true
