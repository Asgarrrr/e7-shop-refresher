[package]
name = "arkyve-refresh-shop"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Local relay that captures Epic Seven Secret Shop traffic, forwards it to the analysis server, and drives the refresh loop by clicking the game window."
license = "MIT"
publish = false

[features]
default = ["pcap-backend", "gui", "actuator"]
# Npcap capture backend — the only one, and the shipped default. Taps every
# adapter through `wpcap.dll` and needs no privilege of its own: it was proven
# end to end from an ordinary *unelevated* process (capture → reassembly →
# uplink → decoded snapshot → refresh job). The exe is still manifested
# `requireAdministrator`, but for the actuator and not for this — see
# `build.rs`. Pulls `libloading` because the DLL is resolved at runtime rather
# than linked (a static link would need the Npcap SDK to build and would kill
# the exe in the Windows loader on a machine without Npcap). Off in the two
# portable lanes, where `app::build_source` returns "no capture backend" instead.
pcap-backend = ["dep:libloading"]
# egui window over the session (dashboard + player commands). Disable for the
# console-only build.
gui = ["dep:eframe"]
# Click-emulation input backends (SendInput / PostMessageW). Only act on
# Windows; elsewhere the executor is replaced by a job-draining stub.
actuator = []

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "io-std",
    "io-util",
    "signal",
] }
# rustls + webpki-roots: the hosted server is wss:// behind Cloudflare, and a
# single-file exe should not depend on the OS trust store. connect_async picks
# up the rustls connector automatically once the feature is on.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
# Direct rustls dep only to pull the `ring` provider and install it in main();
# tokio-tungstenite enables rustls with no provider, which panics at handshake.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
etherparse = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = { version = "0.25", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# The windowed build has no console: stdout is an inert sink, so every log
# would be lost. Logs go to a daily-rotated file under %LOCALAPPDATA%.
tracing-appender = "0.2"
# glow renderer only: targets are Windows (player) and macOS (dev); the
# default wgpu/x11/wayland stacks would only slow the build down.
eframe = { version = "0.35", optional = true, default-features = false, features = [
    "glow",
    "default_fonts",
] }

[target.'cfg(windows)'.dependencies]
# Runtime resolution of `wpcap.dll` for the Npcap backend. Never a link-time
# dependency: see the `pcap-backend` feature comment above.
libloading = { version = "0.8", optional = true }
# Not optional, unlike the two above: `migrate` needs it in *every* Windows
# build to undo the admins-only DACL a WinDivert build left on the app-data
# directory, including the `--no-default-features` one. Three features used to
# each turn it on with `dep:windows-sys`, which is how a lane could end up
# without it.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # Reading and rewriting the app-data directory's DACL (`migrate`).
    "Win32_Security",
    "Win32_Security_Authorization",
    # `GetModuleHandleW`, for the window class the actuator drives.
    "Win32_System_LibraryLoader",
    # `HKLM\...\npcap\Parameters\AdminOnly`: the one read that tells "Npcap is
    # restricted to administrators" apart from "this machine has no adapters".
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Headless widget-interaction tests for the ui module (no renderer needed).
# Dev-deps cannot be feature-gated: the console-only test lane builds egui
# once too; the kittest tests themselves are behind the `gui` feature.
egui_kittest = { version = "0.35", default-features = false, features = ["wgpu", "snapshot"] }
# Paused-clock tests (`start_paused`) for the uplink send timeout.
tokio = { version = "1", features = ["test-util"] }

# Dashboard preview with injected mock data — lets the egui UI be seen on a
# machine with no capture backend (mac dev). Reuses the real `ShopApp`; needs
# eframe, hence the `gui` feature.
[[example]]
name = "ui_preview"
required-features = ["gui"]

# Dependencies are compiled once and reused by every dev and test build; at
# opt-level 0 an egui/glow UI is visibly sluggish (see `examples/ui_preview`)
# and the kittest lane crawls. Our own crate stays unoptimized and debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
# Not `strip = true`: that drops the symbol table too, and `crash.rs`'s
# `Backtrace::force_capture()` — the product's only post-mortem channel —
# then records bare addresses. Debug info goes, symbol names stay.
strip = "debuginfo"
codegen-units = 1
