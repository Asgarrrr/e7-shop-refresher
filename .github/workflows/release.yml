name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Windows release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --bins

      - name: Stage release artifacts
        shell: pwsh
        run: |
          $stage = "release-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/templates" | Out-Null

          # Binaries
          Copy-Item target/release/e7-shop-refresher.exe       "$stage/"
          Copy-Item target/release/e7-shop-refresher-cli.exe   "$stage/"

          # Bundled docs & config
          Copy-Item README.md                              "$stage/"
          Copy-Item LICENSE                                "$stage/"
          Copy-Item config.toml                            "$stage/config.toml"
          Copy-Item templates/README.md                    "$stage/templates/README.md"

          # Example templates are optional — users may have cleaned them
          # locally. Skip gracefully instead of failing the release.
          if (Test-Path templates/examples) {
              New-Item -ItemType Directory -Force -Path "$stage/templates/examples" | Out-Null
              Copy-Item templates/examples/*.png           "$stage/templates/examples/" -ErrorAction SilentlyContinue
          }

          # Zip
          $tag = "${{ github.ref_name }}"
          $zipName = "e7-shop-refresher-$tag-windows-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zipName
          echo "ZIP_PATH=$zipName" >> $env:GITHUB_ENV

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          # One checksum file covers every artifact attached to the
          # release. Users / package managers verify a single file
          # instead of N detached signatures.
          $files = @(
              $env:ZIP_PATH,
              "target/release/e7-shop-refresher.exe",
              "target/release/e7-shop-refresher-cli.exe"
          )
          $lines = foreach ($f in $files) {
              $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
              $name = Split-Path $f -Leaf
              "$h  $name"
          }
          $lines -join "`n" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Downloads on the Releases page:
          # - the full zip (recommended — includes config, README, example templates)
          # - e7-shop-refresher.exe (GUI) and -cli.exe as direct downloads
          #   for users who already have a config.toml and templates set up.
          # - SHA256SUMS.txt for verification.
          files: |
            ${{ env.ZIP_PATH }}
            target/release/e7-shop-refresher.exe
            target/release/e7-shop-refresher-cli.exe
            SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
