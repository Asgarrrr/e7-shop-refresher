name: CI
# The capture backend resolves `wpcap.dll` at runtime and links nothing, so CI
# compiles and tests it on a runner that has no Npcap installed. Only *launching*
# a capture session needs Npcap on the machine, which CI never does.
on:
  push:
  pull_request:
  schedule:
    # Monday morning, for the one gate in this file whose verdict changes while
    # the repository does not: `dependency-policy`'s advisory check. A RustSec
    # advisory is published against a version already pinned in `Cargo.lock`, so
    # on push-and-pull-request alone a tree that nobody touches for a month is a
    # tree nobody re-audits for a month. Everything else here — clippy, tests,
    # the manifest assertion — is a pure function of the commit and learns
    # nothing from being re-run, so the cron is carried by that one job.
    #
    # It is effective rather than decorative, which is worth stating because the
    # obvious failure mode is a cron that re-checks against a cached, frozen
    # advisory database: `cargo deny check` fetches the database on every run
    # unless `--offline` is passed, and no invocation in this file passes it. See
    # the cache step's comment in `dependency-policy` for the rest of that
    # argument.
    - cron: "17 4 * * 1"

# Least privilege, declared rather than inherited. With no `permissions:` block a
# workflow gets whatever the repository's default is — historically
# read-and-write on every scope, and still write today for any repo whose
# setting was never changed — which every third-party action in every job then
# runs with. Nothing here writes to the repo: the three jobs check out, compile,
# test, read the dependency graph and read public commits, so `contents: read` is
# the whole requirement and the rest (packages, issues, pull-requests, id-token,
# attestations, …) are implicitly set to `none` the moment any scope is named.
#
# Declared once at workflow level rather than per job because all three need
# exactly the same thing; the release workflow does the opposite — `{}` at the
# top and a scope list per job — because there the two jobs genuinely differ.
permissions:
  contents: read

# Third-party actions are pinned by full commit SHA, every one of them, with the
# tag it resolved to in a trailing comment. A tag — even `v4` — is a mutable
# pointer the action's owner can move, and `@master` is not even a pointer, it is
# whatever was pushed last; either way the code lands in a job holding this
# repository's token. The SHA is the only ref GitHub will not re-resolve.
#
# The comment is not decoration: a SHA carries no version, so without it nobody
# can tell whether the pin is a month or three years behind, and the pin quietly
# becomes "never updated" instead of "deliberately not updated". Dependabot reads
# these comments and rewrites both halves together, which is why the format has
# to stay exactly `<40 hex> # <tag>`.
jobs:
  verify:
    # `windows-latest` on purpose, and deliberately *not* pinned the way
    # `dependency-policy`'s `ubuntu-24.04` and the release workflow's
    # `windows-2025` are. The two want opposite things from the runner image.
    # This job is where a moving image should be found out: it carries the MSVC
    # `link.exe` that embeds the manifest, the OpenGL stack `eframe` needs, and
    # the Win32 headers behind `windows-sys`, so an image bump that breaks any of
    # them should redden a pull request rather than a tag. The release build
    # wants the reverse — the fewest floating inputs possible — and pins.
    runs-on: windows-latest
    # `dtolnay/rust-toolchain` activates its toolchain with `rustup default` and
    # nothing else, and rustup ranks `rustup default` *below* a repo-root
    # `rust-toolchain.toml`. Without this variable the pinned `channel =
    # "1.92.0"` won every cargo invocation and the `stable` arm was a second
    # MSRV arm — nothing was ever built on current stable. `RUSTUP_TOOLCHAIN`
    # outranks the toolchain file, so the matrix means what it says.
    # `rust-toolchain.toml` stays as it is: it pins *local* builds to the MSRV.
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.92.0", stable]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # `dtolnay/rust-toolchain` has exactly one tag in the whole repository —
      # `v1`, which currently points at the head of `master` and is moved
      # forward with it. So `# v1` below is the tag this SHA resolves to and is
      # what keeps the pin machine-readable, but it names a major version rather
      # than a release: there is no `v1.4.2` to be behind. Reading the pin's age
      # means comparing the SHA to `master`, not the comment to a changelog.
      #
      # That is also why `@master` was the worst ref in this file rather than
      # merely the untidiest. `@v4` on the actions above cannot change without
      # someone deciding to move it; `@master` was whatever had been pushed most
      # recently, chosen by nobody here, executing in a job holding this
      # repository's token. The SHA below was read off `master` on 2026-08-05.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.toolchain }}
      - if: matrix.toolchain == '1.92.0'
        run: cargo fmt --all --check
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - run: cargo clippy --locked --no-default-features --features gui,actuator --all-targets -- -D warnings
      # `gui` and `actuator` on their own. Nobody ships either, so these are not
      # product configurations — they are the cfg shapes a future
      # `cfg(feature = "gui")` block nested inside an `all(windows, feature =
      # "actuator")` region would break while every shipped combination stayed
      # green. Both compile clean today; these two lanes keep it that way.
      - run: cargo clippy --locked --no-default-features --features gui --all-targets -- -D warnings
      - run: cargo clippy --locked --no-default-features --features actuator --all-targets -- -D warnings
      # Both arms of build_source must survive: no backend (above) and the
      # backend alone. There is no third arm and no `--all-features` lane — with
      # WinDivert removed, `--all-features` is the default feature set.
      - name: Check passive Npcap backend
        run: cargo clippy --locked --no-default-features --features pcap-backend --all-targets -- -D warnings
      # The combination actually shipped (pcap-backend + gui + actuator).
      # Checking the pieces separately misses a cfg interaction that only the
      # product build has.
      - name: Check shipped default features
        run: cargo clippy --locked --all-targets -- -D warnings
      # rustdoc was the one lane nothing gated, and it was not clean: the
      # doc-comments here are the design record and they navigate by intra-doc
      # links, two of which had rotted into plain text unnoticed. Levels live in
      # `Cargo.toml`'s `[lints.rustdoc]` rather than in `RUSTDOCFLAGS`, so this
      # step, `just doc` and an editor cannot disagree — and a rustdoc lint added
      # by a future stable release only warns instead of turning this arm red.
      - name: Check the documentation cross-references
        run: cargo doc --locked --no-deps --document-private-items
      - name: Build shipped release (default features)
        if: matrix.toolchain == 'stable'
        run: cargo build --locked --release
      # Everything this exe declares about itself to Windows lives in one
      # embedded manifest, and every declaration in it is a *product*
      # requirement that no compile-time check can see. Drop a `build.rs` link
      # arg and the binary still builds, still links, still runs, and fails only
      # in front of a player:
      #
      #   - `requireAdministrator` — UIPI refuses input aimed at a window whose
      #     integrity level is higher than the sender's, and Epic Seven inherits
      #     **high** from STOVE, which always elevates. Without the token every
      #     click is refused, silently, by `SendInput`.
      #   - `dpiAwareness` / `permonitorv2` — the actuator's coordinates are
      #     physical-pixel arithmetic and only a per-monitor-aware process is
      #     told the truth about a window rect. Without the declaration the
      #     awareness is whatever `winit` happened to set (per-monitor-v2 today,
      #     an undocumented internal one dependency bump from changing), and
      #     `actuator::win::dpi::ensure_dpi_awareness` halts the watch rather
      #     than click at the wrong place. `permonitorv2` is checked as well as
      #     `dpiAwareness` because the element is worthless empty: the value is a
      #     fallback *list* (`permonitorv2, permonitor`) and an element that
      #     survived with the wrong content would pass a check for the tag name
      #     alone.
      #
      # All three are asserted in one step rather than three because they are one
      # artifact property with one failure mode — the manifest did not make it
      # into the exe — and reading an 11 MB file three times to say so would be
      # three ways to be told the same thing.
      #
      # `mt.exe` would parse the resource properly and is deliberately not used:
      # it is a Windows SDK tool this build otherwise needs nothing from, and the
      # question here is not "is the XML well formed" (the linker rejected it
      # already if not) but "is it in there at all", which a byte grep answers.
      # `.Contains` rather than `-notmatch` so the needles stay literal — every
      # token below is metacharacter-free today, and this way a fourth one
      # containing a `.` cannot silently widen into a wildcard.
      - name: Assert the release exe's embedded manifest
        if: matrix.toolchain == 'stable'
        shell: pwsh
        run: |
          $exe = "target\release\arkyve-refresh-shop.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $text = [System.Text.Encoding]::UTF8.GetString($bytes)
          foreach ($claim in "requireAdministrator", "dpiAwareness", "permonitorv2") {
            if (-not $text.Contains($claim)) {
              throw "no $claim in the manifest embedded in $exe"
            }
            "$claim is embedded"
          }
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --no-default-features --features gui,actuator
      - name: Test passive Npcap backend (non-elevated tests)
        run: cargo test --locked --no-default-features --features pcap-backend
      - name: Test shipped default features (non-elevated tests)
        run: cargo test --locked
      # The `#[cfg(not(debug_assertions))]` arm of `stream::budget`'s accounting
      # tests only compiles here: it is the assertion behind `Cargo.toml`'s
      # `overflow-checks = true`, that a shipped build saturates and logs a
      # byte-accounting bug rather than panicking, because a panic from a `Drop`
      # during an unwind aborts with no `crash.log`. Run on both toolchain arms,
      # same as the four test steps above and with no `if:` gate, because debug
      # and release genuinely test different code and there is no
      # toolchain-specific reason to skip either arm.
      - name: Test release configuration (release-only accounting test)
        run: cargo test --locked --release --no-default-features --features gui,actuator

  macos-portable:
    name: Portable suite on macOS
    runs-on: macos-latest
    # Declared per job rather than left to inherit the workflow-level block
    # above, matching this file's habit of declaring what a job needs instead
    # of assuming it. Redundant with the `contents: read` already set at
    # workflow level today, but this job's own requirement (checkout, compile,
    # test — nothing that writes) should stay legible on its own if the
    # workflow-level block above ever changes to differ per job, the way
    # `release.yml`'s does.
    permissions:
      contents: read
    # The only Rust-building job above runs on `windows-latest`, and
    # `dependency-policy`'s `ubuntu-24.04` job installs a toolchain but never
    # builds the crate — so the eight `#[cfg(not(windows))]` sites in
    # `install.rs`, `lib.rs` and `migrate.rs` are compiled by nothing, and
    # `justfile`'s `verify` recipe bills itself as "the lanes that run on any
    # OS, no native backend, no elevation" without anything testing that claim.
    # This job is that test: a compile-and-test gate for the portable lanes,
    # on the one other OS this crate claims to run on.
    #
    # macOS, not Linux: `Cargo.toml:105-106` disables `winit`'s x11/wayland
    # features on `eframe`'s `glow` backend ("targets are Windows and macOS,
    # so wgpu/x11/wayland is build time spent on nothing"), so a `gui` lane on
    # `ubuntu-*` is expected to fail to build for a reason that says nothing
    # about this crate's own portability. macOS is the project's actual
    # second target.
    #
    # Only the portable lanes: the same four commands `just verify` runs on
    # any OS. No `pcap-backend`, no `backends` recipe, no elevation.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.92.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-1.92.0
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - run: cargo clippy --locked --no-default-features --features gui,actuator --all-targets -- -D warnings
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --no-default-features --features gui,actuator

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-24.04
    env:
      CARGO_DENY_VERSION: "0.20.2"
      # Same reason as `verify` above, in the other direction: this job wants the
      # MSRV and got it only because `rust-toolchain.toml` happens to agree with
      # the pinned action. Say it out loud so the agreement is not accidental.
      RUSTUP_TOOLCHAIN: "1.92.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # This step used to be `dtolnay/rust-toolchain@1.92.0` with no `with:`
      # block, and the version came from the *ref*: that action ships a separate
      # branch per Rust release whose `action.yml` has no `toolchain` input at
      # all, the version being baked in. Pinning by SHA therefore cannot be a
      # one-line substitution — master's `action.yml` declares `toolchain` as
      # `required: true` and its first step exits 1 when it arrives empty, so
      # the SHA without the input below is a hard failure, not a silent default.
      #
      # Taking the input back turned the version into a second copy of the
      # string in `RUSTUP_TOOLCHAIN` above, which is the thing that comment
      # exists to warn about, so it reads the env var instead. The MSRV is now
      # named once per job and the "agreement is not accidental" claim is
      # structural rather than a promise. (Both jobs pin the same master SHA;
      # one action, one thing to bump.)
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      # Both `actions/cache` pins below were `11d5960a…`, which is the head of
      # **`actions/checkout`**'s v4 branch and does not exist in `actions/cache`
      # at all (`GET /repos/actions/cache/commits/11d5960a…` → 422, "No commit
      # found for SHA"). GitHub resolves `uses:` against the named repository,
      # so the runner would have stopped at "unable to find version" during step
      # setup and this job would have failed before cargo-deny ever ran —
      # meaning the dependency gate would have been dead rather than lenient.
      # "Would have" and not "was": the job was added on the branch and never
      # pushed, so the last CI run predates it and nothing ever executed this.
      # It was on course to fail on its first run. Corrected to `actions/cache`'s
      # own v4 head.
      #
      # Worth keeping as the argument for pinning by SHA *and* verifying the
      # pin. A 40-hex string is unreadable by eye, so a copy-paste from the
      # wrong line is invisible in review and indistinguishable from a correct
      # pin until a resolver is asked.
      #
      # `.github/dependabot.yml` was credited with doing that check
      # continuously, and it does not: its `github-actions` ecosystem is a
      # version-*bump* bot on a `monthly` schedule, and an unresolvable SHA is an
      # entry it cannot place and skips — no pull request, no failed check,
      # nothing on a branch. The evidence is that `quality.yml` shipped the same
      # class of defect the following day, with a SHA in no repository at all in
      # both its `Swatinem/rust-cache` pins. What Dependabot gives is a monthly
      # grouped bump, which is worth having and is not a gate. The `action-pins`
      # job below is the gate: it asks a resolver, per distinct pin, on every
      # push.
      - name: Cache cargo-deny binary
        id: cargo-deny-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_DENY_VERSION }}

      # A note on what this cache does and does not freeze, because the RustSec
      # database is in it and a frozen advisory database would be a gate that
      # reports last quarter's news. `actions/cache` saves only when the primary
      # key *missed*, so on a week where neither `Cargo.lock` nor `deny.toml`
      # moved the key hits, nothing is re-saved, and the restored
      # `advisory-dbs` is as old as the first save. That is harmless here and
      # only because of one fact: `cargo deny check` fetches the advisory
      # database on every run unless `--offline` is passed, and it is not passed
      # anywhere in this file. The cache is a warm start for the clone, never
      # the data the check reads. `deny.toml`'s `maximum-db-staleness` is the
      # backstop for the case where that fetch quietly starts failing — see the
      # comment there.
      - name: Cache registry indexes and RustSec database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/advisory-dbs
          key: dependency-data-${{ runner.os }}-v1-${{ hashFiles('Cargo.lock', 'deny.toml') }}
          restore-keys: |
            dependency-data-${{ runner.os }}-v1-

      - name: Install pinned cargo-deny
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"

      - name: Verify cargo-deny version
        run: test "$(cargo deny --version)" = "cargo-deny $CARGO_DENY_VERSION"

      - name: Check RustSec advisories and yanked crates
        run: cargo deny --all-features --locked check advisories

      - name: Check dependency licenses, bans, and sources
        run: cargo deny --all-features --locked check bans licenses sources

  action-pins:
    name: Action pins resolve
    runs-on: ubuntu-24.04
    # The gate the comment in `dependency-policy` above was crediting to
    # Dependabot. A SHA pin has one failure mode that review cannot see and no
    # other job here would catch until a runner refused to start the step: the
    # 40 hex characters name a commit that does not exist in the repository they
    # are attached to. It has happened twice on this branch — `actions/cache`
    # pinned to `actions/checkout`'s v4 head, then both of `quality.yml`'s
    # `Swatinem/rust-cache` pins to a SHA in no repository — and in both cases
    # the job holding the bad pin was one that had never run yet, so "CI is
    # green" said nothing about it.
    #
    # Deliberately the cheapest job in the file: no toolchain, no cargo, no
    # cache, no build. One `GET /repos/:owner/:repo/commits/:sha` per *distinct*
    # pin, which is six requests today for eight `uses:` lines. That is what
    # makes it affordable on every push, and running on every push is the whole
    # point — a pin is wrong the moment it is typed, not a month later when a bot
    # next looks.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Every pinned action SHA resolves in its own repository
        env:
          # Repo-scoped, and enough: these are public repositories, and the read
          # is a commit lookup. Named explicitly because `gh` refuses to guess.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=0
          # `<owner>/<repo> <sha>` pairs, deduplicated: the same pin repeated
          # across four jobs is one question, and the dedup is what keeps this
          # job's cost proportional to the pins rather than to the steps.
          grep -hoE '\buses: *[A-Za-z0-9._-]+/[A-Za-z0-9._-]+@[0-9a-fA-F]{40}' \
            .github/workflows/*.yml \
            | sed -E 's/^uses: *//' | tr '@' ' ' | sort -u > pins.txt
          # A check that silently matches nothing is worse than no check: if the
          # pinning convention or this pattern ever drift apart, fail loudly
          # instead of reporting a clean run over an empty list.
          if [ ! -s pins.txt ]; then
            echo "::error::no SHA-pinned actions matched — this check has stopped checking anything"
            exit 1
          fi
          while read -r repo sha; do
            if gh api "repos/$repo/commits/$sha" --jq .sha > /dev/null 2>&1; then
              echo "ok       $repo@$sha"
            else
              echo "::error::$repo@$sha does not name a commit in $repo"
              status=1
            fi
          done < pins.txt
          # The other half of a pin's readability, and the half Dependabot needs:
          # a SHA carries no version, so the trailing `# <tag>` is the only thing
          # that says whether the pin is a month or three years behind. Without
          # it a pin is correct and unbumpable — see this file's header.
          #
          # `[[:space:]]*$` rather than ` *$`: the class includes `\r`, and this
          # repository is developed on Windows. With a bare space the check still
          # passes on a CRLF working tree while silently matching nothing, which
          # is the failure the empty-list guard above exists to refuse.
          if grep -nE '\buses: *[A-Za-z0-9._-]+/[A-Za-z0-9._-]+@[0-9a-fA-F]{40}[[:space:]]*$' \
              .github/workflows/*.yml; then
            echo "::error::the pins listed above carry no '# <tag>' comment"
            status=1
          fi
          exit $status
