name: CI
# The native windivert-backend build needs admin and a kernel driver, so it is a
# documented manual step (see README), not run in CI.
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --no-default-features -- -D warnings
      - run: cargo clippy --no-default-features --features gui,actuator -- -D warnings
      - run: cargo test --no-default-features
      - run: cargo test --no-default-features --features gui,actuator
