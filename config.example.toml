# Copy to `config.toml` and adjust. Every key has a default, but the relay
# refuses to start without at least one [filter] criterion.

# Epic Seven game server TCP port. Capture is passive throughout: the tap hands
# the tool a copy of each matching packet and the original travels on untouched.
# No client port and no proxy setting are needed.
game_port = 3333

# Analysis server. Defaults to the hosted server over wss:// (TLS). A plain
# ws:// URL is accepted only for loopback (127.0.0.1 / localhost) — a
# non-loopback ws:// is refused because it would forward traffic in cleartext.
server_url = "wss://ingest.arkyve.dev/refresh-shop"

[forward]
# Both keys below are retired: still accepted so that config files written by
# earlier versions keep loading, but ignored, and a later release will refuse
# them outright. Nothing here sets them, so nothing warns. If an older file of
# yours does, the app says so once at startup and deletes those lines from it
# then and there — no setting of yours is changed, they had no effect already.
#
# Only the server -> client half of the connection is captured at all: it is the
# one that carries the shop contents, and it is the only one the analysis server
# has ever decoded. There is no longer a direction to choose.
# server_to_client = true
# client_to_server = false

[reconnect]
# Values below 100 ms are raised to 100 ms. A max_ms below the effective
# initial delay is raised to that initial delay.
initial_ms = 1000
max_ms = 30000

[capture]
# Both keys below are retired: still accepted so that config files written by
# earlier versions keep loading, but ignored, and a later release will refuse
# them outright. Nothing here sets them, so nothing warns. If an older file of
# yours does, the app says so once at startup and deletes those lines from it
# then and there — no setting of yours is changed, they had no effect already.
#
# The capture backend builds its own filter from game_port and sizes its own
# buffer; neither is expressible here any more. That is deliberate: this file is
# writable by any ordinary program on the machine, and a filter string from it
# used to be handed to a kernel driver to compile.
# buffer_size = 65575
# filter = "tcp and tcp.SrcPort == 3333"

[filter]
# Player interest criteria, all ANDed. At least one criterion is required:
# with none, every item would match and the relay refuses to start.
# Default hunt: covenant bookmarks + mystic medals.
names = ["ticketrare_name", "ticketspecial_name"]
# kinds = ["equipment"]                 # any-of: equipment, hero, token
# sets = ["set_speed", "set_counter"]   # any-of, exact internal set ids
# min_substats = 3                      # minimum substat count
# max_price = 300000                    # inclusive gold cap; unknown price fails it
# min_grade = 4                         # inclusive gear-grade floor (2, 3, or 4); unknown grade fails it
# include_sold_out = false              # keep sold-out items (default drops them)

# Substats that must all be present; `min` is an inclusive threshold,
# omit it for presence alone.
# [[filter.required_substats]]
# name = "speed"
# min = 8.0

[limits]
# Refresh-loop stop limits. Every key is optional; absent means no limit.
# max_refreshes = 100        # paid refreshes per session
# max_spend = 300            # crystal budget — hard ceiling, never crossed
# max_matches = 5            # cumulative alerted items (not purchases)
# max_duration_ms = 3600000  # session timeout (here: 1 hour)

[actuator]
# Windows build only: the tool refreshes and buys by clicking the game window
# itself. dry_run = true journals the planned clicks (screen coordinates and
# waits) without sending any input — use it to check the coordinates before
# going live. It validates coordinates only: the shield and the mid-job
# window re-checks run on live clicks alone.
# dry_run = false
# How clicks reach the game. "message" (default) posts the clicks straight
# to the window: no focus stolen, you keep the mouse — but the game window
# must stay open and restored (behind other windows is fine; minimizing it
# stops the loop). While a job clicks, an invisible shield covers the game
# window so your mouse cannot deflect the clicks — your other windows above
# the game stay fully usable; only your own clicks on the game itself are
# swallowed for those few seconds. A game window moved or closed mid-job
# halts the loop (journaled). "input" drives the real cursor instead (steals
# focus and mouse) — the fallback if a game update stops honoring posted
# clicks. Before each mouse event it revalidates the acquired window and may
# refocus it; if its identity, rectangle, or focus cannot be verified, the job
# aborts or the loop stops without injecting that event.
# backend = "message"

# [actuator.timings]
# Random extra delay added on top of each tuned click baseline. Each wait
# draws a fresh uniform value in [min_ms, max_ms] and adds it to the baseline,
# so the loop's pauses vary like a human's instead of being identical every
# time. The baselines are calibrated to the game's blocking animations and are
# the floor: a range only ever slows the loop down, never clicks earlier.
# Every range defaults to { min_ms = 0, max_ms = 0 } (the fixed calibrated
# timing, no randomness). min == max is a fixed extra. min_ms above max_ms is
# not read as a fixed min_ms delay — that would hand you a metronome after you
# asked for variability — and max_ms is capped at 60000 (one minute), well past
# any human-looking pause and short of the values that stall the loop between
# two clicks. A line breaking either rule is ignored, not fatal: the app starts,
# that one action runs at its bare baseline, and the startup log says which key
# it dropped and why. Nothing rewrites the line for you, so fix it here or set
# the range from the Setup tab. The same knobs live in that tab (Click
# timings), applied live without editing this file. Baselines, in ms:
# shop_opened 1180, refreshed 780, purchase_resumed 400, recovery 400,
# confirm_refresh_modal 270, buy_modal 150, between_buys 600, scroll_settle 100.
# refreshed = { min_ms = 200, max_ms = 800 }         # after a paid refresh
# between_buys = { min_ms = 150, max_ms = 500 }       # between two buys
# shop_opened = { min_ms = 0, max_ms = 0 }
# purchase_resumed = { min_ms = 0, max_ms = 0 }
# recovery = { min_ms = 0, max_ms = 0 }
# confirm_refresh_modal = { min_ms = 0, max_ms = 0 }
# buy_modal = { min_ms = 0, max_ms = 0 }
# scroll_settle = { min_ms = 0, max_ms = 0 }
