[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
ignore = []

[licenses]
include-dev = true
confidence-threshold = 0.8
unused-allowed-license = "warn"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
exceptions = [
  # Mozilla-licensed terminal coloring used by the test/tooling graph.
  { crate = "colored", allow = ["MPL-2.0"] },
  # Mozilla's public CA certificate data used by rustls roots.
  { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
  # Fonts embedded by egui; scope font licences to that asset crate.
  { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
  # WinDivert's user-mode library and its Rust bindings are LGPL-3.0-or-later.
  # The LGPL is satisfied by *dynamic* linking: `WinDivert.dll` is the official
  # prebuilt binary (never statically linked, see `.cargo/config.toml`) and the
  # exe re-materializes it, with its licence text, into
  # `%LOCALAPPDATA%\arkyve-refresh-shop\` on first run — so a user can drop in
  # their own build of the library, which is the relink freedom the licence
  # requires. Scoped to these two crates only.
  { crate = "windivert", allow = ["LGPL-3.0-or-later"] },
  { crate = "windivert-sys", allow = ["LGPL-3.0-or-later"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
