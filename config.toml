version = 1

[window]
title_contains      = "Epic Seven"
# Executable-name filter — disambiguates when another window shares the
# title fragment. Unset = match by title only.
# process_name      = "Epic Seven"
# Auto-updated when you save a crop via the GUI. The detector uses this
# as the scaling reference; if the live window is at a different size,
# templates are resampled to match.
base_resolution     = [1495, 872]
resize_tolerance_px = 4
# Force the window to base_resolution via SetWindowPos at startup.
# Off by default: fighting Windows decorations + DPI rounding (you ask
# for 1920×1080, you get 1906×1103) makes 1:1 cropping simpler and more
# robust than resize.
auto_resize         = false

[shop]
# Stop conditions. 0 disables that limit. At least one must be > 0
# (or all zero = no auto-stop, manual Stop only).
max_refreshes              = 0
stop_after_minutes         = 0
stop_when_mystic_medals    = 0
stop_when_covenants        = 0

buy_mystic_medals     = true
buy_covenant          = true
# Window-height fraction from the icon centre down to the row's buy
# button. E7 puts the button under the icon, not next to it. Tune via
# Run detection until the red band lands on it.
buy_button_y_offset_ratio = 0.045
# 6 items per refresh, 4 visible at once — 1 scroll reveals the last 2.
# Set to 2 if your setup undershoots; bottom_strip_hash stops early anyway.
max_scrolls_per_round = 1
sleep_when_done = false

[timing]
# Inter-click delay: log-normal sample clamped to [min, max]. Log-normal
# gives fat tails (occasional longer pauses), more humanlike than uniform.
click_delay_mean_ms  = 250.0
click_delay_sigma    = 0.30
click_delay_min_ms   = 120
click_delay_max_ms   = 700

# Curved, eased mouse path with N intermediate moves of randomised duration.
move_steps_min          = 5
move_steps_max          = 10
move_step_min_ms        = 3
move_step_max_ms        = 8
move_to_click_min_ms    = 20
move_to_click_max_ms    = 55
move_curve_amplitude_px = 3.0

anchor_timeout_ms = 5000
poll_interval_ms  = 150

# Rayleigh-distributed click target jitter (px).
jitter_radius_px = 3.0

inter_round_min_ms = 600
inter_round_max_ms = 1800
# Every Nth round, take a longer "looking at screen" break. 0 disables.
long_pause_every_n = 10
long_pause_min_ms  = 5000
long_pause_max_ms  = 12000

# Positive scroll_amount = scroll down (Windows wheel notches).
scroll_amount      = 8
scroll_pause_ms    = 250

# Must outlast the modal slide-in animation (~150 ms in E7). Anything
# beyond is dead time.
modal_open_pause_ms = 220

[matching]
# 0.85 lets bookmark-ish icons cross-match; 0.90 keeps legit hits while
# dropping most false positives. Lower only if real items get missed.
threshold    = 0.9
# Required gap between best and runner-up score. Larger = stricter.
margin       = 0.05
# Native scale only. Expand to [0.97, 1.0, 1.03] if DPI quirks or post-
# update UI tweaks start missing matches.
extra_scales = [1.0]

# Window-relative ROIs as [x, y, w, h] ratios in [0, 1]. Defaults tuned
# for 1920×1080 — fine-tune via the GUI's Regions panel.
[regions]
shop_grid   = [0.425, 0.085, 0.09, 0.915]
anchor_shop = [0.02, 0.04, 0.25, 0.09]

[templates]
dir          = "templates"
anchor_shop  = "shop_header.png"
mystic_medal = "mystic_medal.png"
covenant     = "covenant.png"

# Click zones — bot picks a uniformly random point inside each zone.
# Faster + more robust than template-matching for fixed-position buttons.
# Draw them in the GUI's Zones panel. [x, y, w, h] ratios in [0, 1].
[zones]
refresh = [0.065, 0.892, 0.215, 0.061]
refresh_confirm = [0.529, 0.621, 0.121, 0.057]
buy_confirm = [0.488, 0.686, 0.198, 0.059]
# buy_column: only x/w are used (Y comes from the matched icon at click time).
buy_column = [0.83, 0.115, 0.142, 0.885]
