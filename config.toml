version = 1

[window]
title_contains      = "Epic Seven"
# Executable-name filter — disambiguates when another window shares the
# title fragment. Unset = match by title only.
# process_name      = "Epic Seven"
# Auto-updated when you save a crop via the GUI. The detector uses this
# as the scaling reference; if the live window is at a different size,
# templates are resampled to match.
base_resolution     = [1433, 837]
resize_tolerance_px = 4
# Force the window to base_resolution via SetWindowPos at startup.
# Off by default: fighting Windows decorations + DPI rounding (you ask
# for 1920×1080, you get 1906×1103) makes 1:1 cropping simpler and more
# robust than resize.
auto_resize         = false

[shop]
# Stop conditions. 0 disables that limit. At least one must be > 0
# (or all zero = no auto-stop, manual Stop only).
max_refreshes              = 0
stop_after_minutes         = 0
stop_when_mystic_medals    = 0
stop_when_covenants        = 0
stop_when_gold_spent       = 0

buy_mystic_medals     = true
buy_covenant          = true
# Window-height fraction from the icon centre down to the row's buy
# button. E7 puts the button under the icon, not next to it. Calibrate
# on the Setup tab: drag the red line to an item centre, then drag the
# red box onto that row's Buy button — this value updates live.
buy_button_y_offset_ratio = 0.09
# Vertical extent of the click band around the offset, as a window-height
# fraction. Each click is randomised inside this band — wider absorbs
# Y-drift between resolutions, narrower keeps clicks on the button itself.
buy_button_band_h_ratio = 0.063
# User-placed reference Y on the Setup-tab snapshot (fraction of window
# height). Drives where the calibration line and box render; the bot
# itself uses live detection, not this value.
buy_calibration_line_y_ratio = 0.65
# 6 items per refresh, 4 visible at once — 1 scroll reveals the last 2.
# Set to 2 if your setup undershoots; bottom_strip_hash stops early anyway.
max_scrolls_per_round = 1
sleep_when_done = false

[timing]
# Inter-click delay: log-normal sample clamped to [min, max]. Log-normal
# gives fat tails (occasional longer pauses), more humanlike than uniform.
click_delay_mean_ms  = 250.0
click_delay_sigma    = 0.30
click_delay_min_ms   = 120
click_delay_max_ms   = 700

# Curved, eased mouse path with N intermediate moves of randomised duration.
move_steps_min          = 5
move_steps_max          = 10
move_step_min_ms        = 3
move_step_max_ms        = 8
move_to_click_min_ms    = 20
move_to_click_max_ms    = 55
move_curve_amplitude_px = 3.0

# Rayleigh-distributed click target jitter (px).
jitter_radius_px = 3.0

inter_round_min_ms = 600
inter_round_max_ms = 1800
# Every Nth round, take a longer "looking at screen" break. 0 disables.
long_pause_every_n = 10
long_pause_min_ms  = 5000
long_pause_max_ms  = 12000

# Positive scroll_amount = scroll down (Windows wheel notches).
scroll_amount      = 8
scroll_pause_ms    = 250

# Must outlast the modal slide-in animation (~150 ms in E7). Anything
# beyond is dead time.
modal_open_pause_ms = 220

# Cooperative mode — pause the bot when you touch the mouse/keyboard,
# resume after this many ms of idle. 0 disables (bot fights you for the
# cursor, original behaviour). 1500 ms ≈ send a Discord message without
# losing a click mid-sentence.
cooperative_idle_ms = 1500

[matching]
# 0.85 lets bookmark-ish icons cross-match; 0.92 plus the color_check
# verification keeps legit hits while dropping the small-template
# cross-colour FPs (orange medal hashing similarly to green friendship
# bookmark at grayscale). Lower only if real items get missed.
threshold    = 0.92
# Required gap between best and runner-up score. Larger = stricter.
margin       = 0.05
# Pre-built template scales — the runner picks the best-fitting one per
# match. The ±5% spread absorbs the title-bar-included-vs-client-area
# drift you see when the user resizes the game window mid-session
# without having to rebuild the Detector.
extra_scales = [0.95, 1.0, 1.05]
# Setup-tab live preview cadence in milliseconds (100–5000). Drives
# capture + NCC frequency for the preview only — the bot loop is not
# gated by this. Lower = more responsive zone drag, higher CPU.
preview_refresh_ms = 500

[templates]
# Override directory for the bundled item templates. Leave the defaults
# — every template name listed here has a binary-embedded fallback, so
# missing files are not an error.
dir          = "templates"
mystic_medal = "mystic_medal.png"
covenant     = "covenant.png"

# `[regions]` and `[zones]` are intentionally omitted from defaults: all
# click positions and search regions are now compile-time constants in
# `src/layout.rs`, derived geometrically from the fixed E7 Secret Shop
# layout. The schema still parses these sections for back-compat with
# pre-auto-calibration configs — the runtime just ignores whatever's
# there.

# Optional outbound pings. Empty webhook URL = disabled.
# Paste a Discord webhook ("Server Settings → Integrations → Webhooks") to
# receive a one-line summary when a stop condition fires.
[notifications]
discord_webhook_url = ""
