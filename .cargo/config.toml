# WinDivert linking. We link DYNAMICALLY against the official WinDivert release
# binaries vendored under `vendor/windivert/` (WinDivert.lib at build time; the
# exe loads WinDivert.dll at runtime, which in turn loads WinDivert{64,32}.sys).
#
# We deliberately do NOT use `WINDIVERT_STATIC`: statically linking the C that
# `windivert-sys` compiles from source produces a RELEASE binary that overflows
# the stack at startup (before the window opens). The self-compiled object is
# built with flags that corrupt the release build's stack-guard probing, so
# every function with a frame larger than a page faults on the guard page.
# Debug builds are unaffected, which is why it only bit the shipped .exe. The
# official prebuilt DLL is a correct build and works.
#
# `relative = true` resolves the path against this file's directory (repo root),
# so the build is reproducible on any machine that has the repo.
#
# DISTRIBUTION: ship the .exe alone. Both `WinDivert.dll` and `WinDivert64.sys`
# are embedded in it (`include_bytes!`) and self-extracted at first run into
# `%LOCALAPPDATA%\arkyve-refresh-shop\` (nothing lands beside the exe). The DLL
# is delay-loaded (see `build.rs`) so its import resolves after that extraction
# rather than at process load; it is then preloaded by full path from there.
#
# The vendored `WinDivert.lib` was regenerated from `WinDivert.def` (via
# `lib.exe /DEF`) into a proper MSVC short-import library — the official release
# ships a "long" import lib that `/DELAYLOAD` silently ignores (LNK4199).
[env]
WINDIVERT_PATH = { value = "vendor/windivert", relative = true }
