# Lien statique : le code user-mode de WinDivert est compilé dans l'exe (depuis
# les sources C vendorisées par windivert-sys, via MSVC). Plus de WinDivert.dll
# à distribuer — seul le driver WinDivert64.sys reste nécessaire, embarqué dans
# l'exe et extrait au runtime.
[env]
WINDIVERT_STATIC = "1"
